<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" role="img" aria-label="rank：用两个小矩阵表示权重增量" font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><title>rank：用两个小矩阵表示权重增量</title><rect width="800" height="580" rx="18" fill="white"/><text x="30" y="49" font-size="28" fill="#243648" font-weight="700">rank：用两个小矩阵表示权重增量</text><text x="30" y="98" font-size="22" fill="#243648" font-weight="400">单层算术示例：4096 × 4096，rank = 32</text><rect x="30" y="129" width="740" height="75" rx="12" fill="#f3f6f8" stroke="#cbd5e1"/><text x="48" y="174.5" font-size="24" fill="#243648" font-weight="400">直接训练：4096 × 4096 = 16,777,216 个参数</text><text x="370" y="251" font-size="34" fill="#243648" font-weight="400">↓</text><rect x="30" y="280" width="350" height="86" rx="12" fill="#eff9f5" stroke="#b6dcd1"/><text x="48" y="331.0" font-size="24" fill="#243648" font-weight="400">B：4096 × 32</text><rect x="420" y="280" width="350" height="86" rx="12" fill="#eff9f5" stroke="#b6dcd1"/><text x="438" y="331.0" font-size="24" fill="#243648" font-weight="400">A：32 × 4096</text><text x="385" y="333" font-size="25" fill="#243648" font-weight="400">×</text><text x="30" y="418" font-size="23" fill="#243648" font-weight="400">LoRA：4096 × 32 + 32 × 4096 = 262,144</text><text x="30" y="463" font-size="27" fill="#087f82" font-weight="700">只需训练原矩阵参数量的 1.56%</text><text x="30" y="508" font-size="21" fill="#243648" font-weight="400">这是一层的示例，不是本章模型约 2% 的全局比例。</text><text x="30" y="545" font-size="21" fill="#243648" font-weight="400">网页中可以切换 rank，观察参数量变化。</text></svg>
