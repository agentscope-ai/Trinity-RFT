<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="fwd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <marker id="back" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#16a34a"/>
    </marker>
    <filter id="soft" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="860" height="250" fill="#ffffff"/>

  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="20" y="70" width="150" height="70" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2" filter="url(#soft)"/>
    <text x="95" y="98" fill="#4338ca">① rollout</text>
    <text x="95" y="120" fill="#6366f1" font-size="11.5" font-weight="400">policy 玩出轨迹（ch2）</text>

    <rect x="190" y="70" width="150" height="70" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" filter="url(#soft)"/>
    <text x="265" y="98" fill="#b45309">② reward</text>
    <text x="265" y="120" fill="#d97706" font-size="11.5" font-weight="400">环境给分（ch3）</text>

    <rect x="360" y="70" width="150" height="70" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2" filter="url(#soft)"/>
    <text x="435" y="98" fill="#7e22ce">③ advantage</text>
    <text x="435" y="120" fill="#9333ea" font-size="11.5" font-weight="400">组内相对比较（ch4）</text>

    <rect x="530" y="70" width="150" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#soft)"/>
    <text x="605" y="98" fill="#15803d">④ loss + 更新</text>
    <text x="605" y="120" fill="#166534" font-size="11.5" font-weight="400">advantage→梯度（ch5）</text>

    <rect x="700" y="70" width="140" height="70" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2" filter="url(#soft)"/>
    <text x="770" y="98" fill="#334155">⑤ 新 policy</text>
    <text x="770" y="120" fill="#475569" font-size="11.5" font-weight="400">权重被微调</text>
  </g>

  <line x1="170" y1="105" x2="188" y2="105" stroke="#64748b" stroke-width="2" marker-end="url(#fwd)"/>
  <line x1="340" y1="105" x2="358" y2="105" stroke="#64748b" stroke-width="2" marker-end="url(#fwd)"/>
  <line x1="510" y1="105" x2="528" y2="105" stroke="#64748b" stroke-width="2" marker-end="url(#fwd)"/>
  <line x1="680" y1="105" x2="698" y2="105" stroke="#64748b" stroke-width="2" marker-end="url(#fwd)"/>

  <!-- loop back -->
  <path d="M770 140 C 770 200, 95 200, 95 142" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#back)"/>
  <text x="430" y="222" fill="#15803d" font-size="12.5" text-anchor="middle">新 policy 回到 ① 再玩一轮 —— RL 就是把这个循环重复很多步，分数越来越高</text>
</svg>
