<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6366f1"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f59e0b"/>
    </marker>
    <filter id="soft" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="640" height="280" fill="#ffffff"/>

  <!-- policy -->
  <rect x="60" y="90" width="200" height="84" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2" filter="url(#soft)"/>
  <text x="160" y="124" fill="#4338ca" font-size="17" font-weight="700" text-anchor="middle">policy（模型）</text>
  <text x="160" y="148" fill="#6366f1" font-size="12.5" text-anchor="middle">做决策的一方</text>

  <!-- environment -->
  <rect x="380" y="90" width="200" height="84" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" filter="url(#soft)"/>
  <text x="480" y="124" fill="#b45309" font-size="17" font-weight="700" text-anchor="middle">environment（环境）</text>
  <text x="480" y="148" fill="#d97706" font-size="12.5" text-anchor="middle">接受动作、返回结果</text>

  <!-- action arrow (top) -->
  <line x1="262" y1="112" x2="376" y2="112" stroke="#6366f1" stroke-width="2.2" marker-end="url(#a1)"/>
  <text x="320" y="100" fill="#4338ca" font-size="13.5" font-weight="700" text-anchor="middle">action（动作）</text>

  <!-- state+reward arrow (bottom) -->
  <line x1="378" y1="152" x2="264" y2="152" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#a2)"/>
  <text x="320" y="202" fill="#b45309" font-size="13.5" font-weight="700" text-anchor="middle">state（观察）+ reward（分）</text>

  <!-- caption -->
  <text x="320" y="234" fill="#475569" font-size="13" text-anchor="middle">这个循环重复很多步 = 一条 trajectory；</text>
  <text x="320" y="256" fill="#475569" font-size="13" text-anchor="middle">环境在轨迹结束时给出 reward，RL 用它调整 policy</text>
</svg>
