<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" role="img" aria-label="同一个底座，多个任务版本" font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><title>同一个底座，多个任务版本</title><rect width="800" height="580" rx="18" fill="white"/><text x="30" y="49" font-size="28" fill="#243648" font-weight="700">同一个底座，多个任务版本</text><text x="30" y="108" font-size="21" fill="#243648" font-weight="400">全参数：每个任务一份完整权重</text><text x="420" y="108" font-size="21" fill="#243648" font-weight="400">LoRA：每个任务一份小 adapter</text><rect x="30" y="144" width="350" height="72" rx="12" fill="#f4f0fc" stroke="#dbd0ed"/><text x="48" y="188.0" font-size="24" fill="#243648" font-weight="400">客服：完整模型</text><rect x="30" y="236" width="350" height="72" rx="12" fill="#f4f0fc" stroke="#dbd0ed"/><text x="48" y="280.0" font-size="24" fill="#243648" font-weight="400">代码：完整模型</text><rect x="30" y="328" width="350" height="72" rx="12" fill="#f4f0fc" stroke="#dbd0ed"/><text x="48" y="372.0" font-size="24" fill="#243648" font-weight="400">ALFWorld：完整模型</text><rect x="420" y="144" width="350" height="52" rx="12" fill="#eff9f5" stroke="#b6dcd1"/><text x="438" y="178.0" font-size="24" fill="#243648" font-weight="400">客服 adapter</text><rect x="420" y="211" width="350" height="52" rx="12" fill="#eff9f5" stroke="#b6dcd1"/><text x="438" y="245.0" font-size="24" fill="#243648" font-weight="400">代码 adapter</text><rect x="420" y="278" width="350" height="52" rx="12" fill="#eff9f5" stroke="#b6dcd1"/><text x="438" y="312.0" font-size="24" fill="#243648" font-weight="400">ALFWorld adapter</text><text x="587" y="372" font-size="30" fill="#243648" font-weight="400">↑</text><rect x="420" y="389" width="350" height="68" rx="12" fill="#f3f6f8" stroke="#cbd5e1"/><text x="438" y="431.0" font-size="24" fill="#243648" font-weight="400">一份共享的基础模型</text><text x="30" y="499" font-size="22" fill="#243648" font-weight="400">小 adapter 易于保存、分发与切换，需配套基础模型。</text><text x="30" y="543" font-size="20" fill="#243648" font-weight="400">图块大小不代表显存比例；并发容量取决于后端和资源。</text></svg>
