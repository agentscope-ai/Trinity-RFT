<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f59e0b"/>
    </marker>
    <marker id="loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#d97706"/>
    </marker>
    <marker id="down" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#16a34a"/>
    </marker>
    <filter id="soft" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="860" height="520" fill="#ffffff"/>

  <!-- ===== Layer 1: trainer step ===== -->
  <rect x="20" y="20" width="600" height="480" rx="18" fill="#eef2ff" stroke="#6366f1" stroke-width="2" filter="url(#soft)"/>
  <text x="44" y="54" fill="#4338ca" font-size="19" font-weight="700">Trainer step（一次训练步，~6 min）</text>
  <text x="44" y="78" fill="#6366f1" font-size="13">= 16 task × G=16 → 256 trajectory → ~7680 experience</text>

  <!-- ===== Layer 2: trajectory ===== -->
  <rect x="44" y="96" width="552" height="240" rx="15" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="66" y="124" fill="#7e22ce" font-size="16" font-weight="700">Trajectory（一条 episode）</text>
  <rect x="300" y="106" width="56" height="22" rx="11" fill="#a855f7"/>
  <text x="328" y="121" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">× 256</text>
  <text x="370" y="122" fill="#9333ea" font-size="12">≤30 env step，结束拿 reward</text>

  <!-- ===== Layer 3: env step loop ===== -->
  <rect x="66" y="146" width="508" height="176" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="86" y="170" fill="#b45309" font-size="15" font-weight="700">env step 循环</text>
  <text x="192" y="170" fill="#d97706" font-size="12">—— 本章主角</text>

  <g font-size="13" font-weight="600" text-anchor="middle">
    <rect x="86" y="190" width="140" height="46" rx="9" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="156" y="209" fill="#92400e">observation</text>
    <text x="156" y="225" fill="#a16207" font-size="10.5" font-weight="400">= state（看到什么）</text>

    <rect x="250" y="190" width="140" height="46" rx="9" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="320" y="209" fill="#92400e">policy 决策</text>
    <text x="320" y="225" fill="#a16207" font-size="10.5" font-weight="400">输出 action</text>

    <rect x="414" y="190" width="140" height="46" rx="9" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="484" y="209" fill="#92400e">env 执行</text>
    <text x="484" y="225" fill="#a16207" font-size="10.5" font-weight="400">返回 reward</text>
  </g>

  <line x1="226" y1="213" x2="248" y2="213" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="213" x2="412" y2="213" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- loop-back -->
  <path d="M484 236 C 484 284, 156 284, 156 238" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#loop)"/>
  <text x="320" y="306" fill="#d97706" font-size="11.5" text-anchor="middle">新 observation + reward 回灌，进入下一步</text>

  <!-- ===== experience output (inside layer1, below layer2) ===== -->
  <line x1="320" y1="336" x2="320" y2="352" stroke="#16a34a" stroke-width="2" marker-end="url(#down)"/>
  <rect x="66" y="356" width="508" height="62" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="86" y="382" fill="#15803d" font-size="14" font-weight="700">每个 env step = 1 个 experience</text>
  <text x="86" y="402" fill="#166534" font-size="12">= 一个 (state, action) 训练样本（buffer 一行）→ 第 5 章更新</text>

  <!-- ===== right panel: RL vocab ===== -->
  <rect x="640" y="20" width="200" height="480" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="660" y="52" fill="#334155" font-size="15" font-weight="700">RL 词汇 ↔ 本教程</text>
  <g font-size="12.5" fill="#475569">
    <text x="660" y="86" font-weight="700" fill="#0f766e">state</text>
    <text x="724" y="86">= observation</text>
    <text x="660" y="114" font-weight="700" fill="#0f766e">action</text>
    <text x="724" y="114">= 一条命令</text>
    <text x="660" y="142" font-weight="700" fill="#0f766e">reward</text>
    <text x="724" y="142">= 环境的分</text>
    <text x="660" y="170" font-weight="700" fill="#0f766e">policy</text>
    <text x="724" y="170">= 被训模型</text>
    <text x="660" y="198" font-weight="700" fill="#0f766e">trajectory</text>
    <text x="724" y="198">= 一整局</text>
    <text x="660" y="226" font-weight="700" fill="#0f766e">experience</text>
    <text x="724" y="226">= 样本行</text>
  </g>
  <line x1="660" y1="248" x2="820" y2="248" stroke="#cbd5e1" stroke-width="1"/>
  <text x="660" y="274" fill="#64748b" font-size="12">三层嵌套：</text>
  <text x="660" y="296" fill="#4338ca" font-size="12">外 = 一次训练步</text>
  <text x="660" y="316" fill="#7e22ce" font-size="12">中 = 一条 trajectory</text>
  <text x="660" y="336" fill="#b45309" font-size="12">内 = 一个 env step</text>
  <text x="660" y="368" fill="#64748b" font-size="12">第 2 章讲中/内两层；</text>
  <text x="660" y="388" fill="#64748b" font-size="12">experience 如何变梯度</text>
  <text x="660" y="408" fill="#64748b" font-size="12">见第 4、5 章。</text>
</svg>
