<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <marker id="loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#16a34a"/>
    </marker>
    <filter id="soft" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="880" height="300" fill="#ffffff"/>
  <text x="30" y="34" fill="#334155" font-size="16" font-weight="700">一个 trainer step = 四小步</text>

  <!-- 4 boxes -->
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="60" width="185" height="92" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2" filter="url(#soft)"/>
    <text x="122" y="86" fill="#4338ca" font-size="14" font-weight="700">① forward</text>
    <text x="122" y="108" fill="#475569">用当前 policy 算每个</text>
    <text x="122" y="126" fill="#475569">action token 的</text>
    <text x="122" y="144" fill="#475569">log P_old / P_new</text>

    <rect x="245" y="60" width="185" height="92" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" filter="url(#soft)"/>
    <text x="337" y="86" fill="#b45309" font-size="14" font-weight="700">② loss</text>
    <text x="337" y="108" fill="#475569">把 advantage + clip</text>
    <text x="337" y="126" fill="#475569">+ KL 组合成</text>
    <text x="337" y="144" fill="#475569">一个标量 loss</text>

    <rect x="460" y="60" width="185" height="92" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2" filter="url(#soft)"/>
    <text x="552" y="86" fill="#7e22ce" font-size="14" font-weight="700">③ backward</text>
    <text x="552" y="108" fill="#475569">对 loss 求梯度</text>
    <text x="552" y="126" fill="#475569">（每个权重该往哪调、</text>
    <text x="552" y="144" fill="#475569">调多少）</text>

    <rect x="675" y="60" width="175" height="92" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#soft)"/>
    <text x="762" y="86" fill="#15803d" font-size="14" font-weight="700">④ optim</text>
    <text x="762" y="108" fill="#475569">按学习率 lr 更新权重</text>
    <text x="762" y="126" fill="#475569">→ 得到新 policy</text>
  </g>

  <!-- arrows -->
  <line x1="215" y1="106" x2="243" y2="106" stroke="#64748b" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="430" y1="106" x2="458" y2="106" stroke="#64748b" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="645" y1="106" x2="673" y2="106" stroke="#64748b" stroke-width="2" marker-end="url(#arw)"/>

  <!-- loop back to rollout -->
  <path d="M762 152 C 762 230, 122 230, 122 154" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#loop)"/>
  <text x="440" y="252" fill="#15803d" font-size="12.5" text-anchor="middle">新 policy 回到 rollout，采下一批数据（第 2 章）——如此循环，reward 越来越高</text>
</svg>
