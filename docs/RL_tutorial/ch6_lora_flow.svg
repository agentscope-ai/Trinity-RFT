<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-label="LoRA：冻结原权重，训练低秩分支" font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><title>LoRA：冻结原权重，训练低秩分支</title><rect width="800" height="620" rx="18" fill="white"/><text x="30" y="49" font-size="28" fill="#243648" font-weight="700">LoRA：冻结原权重，训练低秩分支</text><rect x="30" y="80" width="740" height="70" rx="12" fill="#f4f0fc" stroke="#dbd0ed"/><text x="48" y="123.0" font-size="24" fill="#243648" font-weight="400">全参数：x → W（全部可训练）→ y</text><text x="250" y="196" font-size="22" fill="#243648" font-weight="400">同一个输入 x 分成两路</text><text x="195" y="240" font-size="30" fill="#243648" font-weight="400">↓</text><text x="573" y="240" font-size="30" fill="#243648" font-weight="400">↓</text><rect x="30" y="260" width="350" height="88" rx="12" fill="#f3f6f8" stroke="#cbd5e1"/><text x="48" y="312.0" font-size="24" fill="#243648" font-weight="400">W 冻结，不更新</text><rect x="420" y="260" width="350" height="88" rx="12" fill="#eff9f5" stroke="#b6dcd1"/><text x="438" y="312.0" font-size="24" fill="#243648" font-weight="400">A → B 可训练</text><text x="145" y="391" font-size="28" fill="#243648" font-weight="400">Wx</text><text x="516" y="391" font-size="28" fill="#243648" font-weight="400">s · B(Ax)</text><text x="195" y="439" font-size="30" fill="#243648" font-weight="400">↓</text><text x="573" y="439" font-size="30" fill="#243648" font-weight="400">↓</text><rect x="145" y="461" width="510" height="76" rx="12" fill="#eff9f5" stroke="#b6dcd1"/><text x="163" y="507.0" font-size="24" fill="#243648" font-weight="400">相加：y = Wx + s · B(Ax)</text><text x="30" y="582" font-size="21" fill="#243648" font-weight="400">只更新 A、B；W 仍参与计算。s 通常取 α/r。</text></svg>
